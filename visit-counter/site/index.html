<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visit Counter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #FAF7F2;
      color: #2C2520;
    }
    .counter-card {
      background: #FFFFFF;
      padding: 3rem 4rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(44, 37, 32, 0.08);
      border: 1px solid rgba(44, 37, 32, 0.08);
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="counter-card" id="counter">Visits to this page: Loading...</div>

  <script>
    fetch('http://localhost:8082/visits')
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.json();
      })
      .then(data => {
        document.getElementById('counter').textContent = 'Visits to this page: ' + data.visits;
      })
      .catch(error => {
        console.error('Failed to load visit count:', error);
        document.getElementById('counter').textContent = 'Visits to this page: (unable to connect to API)';
      });
  </script>
</body>
</html>
